<style>
:root{--bg:#070707;--ink:#f4f2eb;--muted:#8b8983;--green:#00b86f;--line:rgba(255,255,255,.1);--card:#101010}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif}body{min-height:100vh}.wrap{max-width:1280px;margin:0 auto;padding:28px 30px 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:80px}.brand{display:flex;align-items:center;gap:7px}.brand img{display:block;height:60px;width:auto;object-fit:contain}.hero-logo{display:block;height:195px;width:auto;max-width:100%;object-fit:contain;margin:0 0 28px auto}.hero-copy{display:flex;flex-direction:column;align-items:flex-start}.kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.back{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#c8c5be}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:80px;align-items:end;margin-bottom:90px}.hero h1{font-size:clamp(52px,8vw,108px);line-height:.9;letter-spacing:-.06em;margin:0;font-weight:650}.hero p{font-size:18px;line-height:1.45;color:#b7b3aa;max-width:470px;margin:0 0 8px}.section{padding:42px 0 56px;border-top:1px solid var(--line);position:relative}.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:32px}.num{font-size:10px;letter-spacing:.15em;color:var(--muted);margin-bottom:8px}.title{font-size:34px;line-height:1;letter-spacing:-.04em;margin:0}.subtitle{color:var(--muted);font-size:14px;margin-top:8px}.info{width:25px;height:25px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:transparent;font-weight:650;cursor:pointer;color:#ddd}.grid{display:grid;grid-template-columns:420px 1fr;gap:55px;align-items:center}.donut-wrap{display:flex;justify-content:center;align-items:center;min-height:340px}.donut{width:300px;height:300px}.bars{display:grid;gap:16px}.bar-row{display:grid;grid-template-columns:150px 1fr 60px;gap:12px;align-items:center;font-s ,.12)}.tl-col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:10px}.tl-bar{width:min(52px,70%);height:0;background:var(--green);border-radius:6px 6px 2px 2px;transition:height 1s cubic-bezier(.2,.8,.2,1)}.tl-count{font-size:12px}.tl-label{font-size:11px;color:var(--muted);text-align:center;min-height:28px;display:flex;align-items:flex-start;justify-content:center}.tl-year{font-size:12px;color:#ddd;letter-spacing:.03em}.tl-note{font-size:10px;color:var(--muted)}.heatmap{overflow:auto}.heat{display:grid;gap:3px;min-width:560px}.heat-cell{min-height:45px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:3px;background:#111;border:1px solid rgba(255,255,255,.03)}.heat-label{font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:5px;text-align:center}.bridge{display:grid;grid-template-columns:1.3fr .7fr;gap:70px;align-items:start}.bridge h2{font-size:48px;line-height:1;letter-spacing:-.04em;margin:0}.bridge p{color:#aaa;max-width:640px;line-height:1.55;font-size:16px}.metrics{display:grid;gap:18px}.metric{padding:18px 0;border-top:1px solid var(--line)}.metric .lab{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}.metric .val{font-size:36px;letter-spacing:-.04em;margin-top:5px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:22px;z-index:20}.modal.open{display:flex}.modal-card{max-width:600px;width:100%;background:#0e0e0e;border:1px solid rgba(255,255,255,.12);padding:30px}.modal-card h3{margin:0 0 12px;font-size:22px}.modal-card p{color:#b9b6ae;line-height:1.55;font-size:14px}.modal-close{margin-top:16px;border:1px solid rgba(255,255,255,.12);background:transparent;padding:9px 14px;border-radius:8px;cursor:pointer}.donut-center{font-size:36px;font-weight:650;text-anchor:middle}.donut-sub{font-size:10px;fill:var(--muted);letter-spacing: em}.network-node.person{width:74px;height:74px;left:39%;top:50%;transform:translateY(-50%);border:1.5px solid rgba(255,255,255,.35);background:#111;color:#f4f2eb}.network-link{position:absolute;height:1px;background:rgba(255,255,255,.22);transform-origin:left center;top:50%}.network-link.a{left:20%;width:19%}.network-link.b{left:48.5%;width:18%;background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,.08))}.fan{position:absolute;left:67%;top:50%;width:150px;height:150px;transform:translateY(-50%)}.fan-node{position:absolute;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:#0d0d0d}.fan-node:nth-child(1){left:10px;top:61px}.fan-node:nth-child(2){left:30px;top:22px}.fan-node:nth-child(3){left:76px;top:4px}.fan-node:nth-child(4){left:120px;top:20px}.fan-node:nth-child(5){left:132px;top:62px}.fan-node:nth-child(6){left:116px;top:106px}.fan-node:nth-child(7){left:72px;top:122px}.fan-node:nth-child(8){left:28px;top:106px}.fan-label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;text-align:center;font-size:10px;color:#aaa;line-height:1.35}.network-caption{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;margin-top:14px}.network-caption p{margin:0;color:#aaa;font-size:14px;line-height:1.55}.density-note{color:var(--muted)!important;font-size:11px!important;max-width:none!important;margin:0!important;line-height:1.55!important}@media(max-width:700px){.network-visual{min-height:340px}.network-stage{height:320px;transform:scale(.82);transform-origin:center}.network-caption{grid-template-columns:1fr;gap:12px}.network-caption p{max-width:none}}@media(max-width:900px){.worlds-wrap{grid-template-columns:1fr}.venn{min-height:380px}}

</head><body>
<div class="wrap"><div class="top"><div class="brand"><span class="kicker">SAMU SOCIAL MAP</span><img src="logo.png" alt="Logo"></div><a class="back" href="Samu_mapa_interactivo.html">← MAPA</a></div><header class="hero"><h1>L’arquitectura<br>de les teves connexions.</h1><div class="hero-copy"><img class="hero-logo" src="logo.png" alt="Logo"><p>Una radiografia de les persones, els cercles i els ponts que formen la teva xarxa social.</p></div></header><main id="content"></main></div>
<div class="modal" id="modal"><div class="modal-card"><h3 id="modalTitle"></h3><p id="modalText"></p><button class="modal-close" id="modalClose">Tancar</button></div></div>
<script>
const data={people:[],connections:[],refs:[]};
const colors=new Map();
const cats=[];

const ca=v=>(v==null||String(v).trim()==='')?'No consta':String(v).trim();
const norm=v=>v==null?'':String(v).trim();
const colorFor=cat=>{let h=0;for(let i=0;i<cat.length;i++)h=(h*31+cat.charCodeAt(i))%360;return `hsl(${h} 72% 60%)`};
const esc=s=>String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[m]));
const label=name=>{const p=norm(name).split(/\s+/).filter(Boolean);return p.length>1?`${p[0]} ${p[1][0].toUpperCase()}.`:p[0]||'No consta'};
const rows=s=>XLSX.utils.sheet_to_json(s,{defval:''});

async function load(){
  const response=await fetch('data.xlsx',{cache:'no-store'});
  if(!response.ok)throw new Error('No s’ha pogut carregar data.xlsx.');
  const buffer=await response.arrayBuffer();
  const wb=XLSX.read(buffer,{type:'array'});
  ['PERSONAS','CONEXIONES','REFERENCIAS'].forEach(sheet=>{if(!wb.SheetNames.includes(sheet))throw new Error(`Falta la fulla ${sheet}.`)});
  data.people=rows(wb.Sheets.PERSONAS);
  data.connections=rows(wb.Sheets.CONEXIONES);
  data.refs=rows(wb.Sheets.REFERENCIAS);
  const unique=[...new Set(data.people.map(p=>ca(p['Tipo'])))];
  unique.forEach(c=>{cats.push(c);colors.set(c,colorFor(c))});
}

function uniqueConnections(){
  const unique=new Set();

  data.connections.forEach(c=>{
    const a=String(c['ID A']||'').trim();
    const b=String(c['ID B']||'').trim();

    if(!a||!b||a===b)return;

    const key=[a,b].sort().join('|||');
    unique.add(key);
  });

  return unique;
}

function countConns(){
  const m=new Map(data.people.map(p=>[String(p.ID),0]));
  const unique=uniqueConnections();

  unique.forEach(key=>{
    const [a,b]=key.split('|||');

    if(m.has(a))m.set(a,m.get(a)+1);
    if(m.has(b))m.set(b,m.get(b)+1);
  });

  return m;
}

function makeSection(num,title,sub,body,key,help){
  return '<section class="section" id="'+key+'"><div class="section-head"><div><div class="num">'+num+'</div><h2 class="title">'+title+'</h2><div class="subtitle">'+sub+'</div></div><button class="info" data-help="'+esc(help)+'" data-key="'+key+'">i</button></div>'+body+'</section>';
}

function donut(){
  const counts=cats.map(c=>data.people.filter(p=>ca(p['Tipo'])===c).length);
  const total=data.people.length||1;
  const r=120,cx=150,cy=150,circ=2*Math.PI*r;
  let offset=0;
  let arcs='';
  counts.forEach((n,i)=>{
    const c=cats[i],dash=(n/total)*circ;
    arcs+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colors.get(c)+'" stroke-width="34" stroke-dasharray="0 '+circ+'" data-dash="'+dash+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 150 150)" style="transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1)"/>';
    offset+=dash;
  });
  return '<div class="donut-wrap"><svg class="donut" viewBox="0 0 300 300"><circle cx="150" cy="150" r="120" fill="none" stroke="#171717" stroke-width="34">'+''+'</circle>'+arcs+'<text x="150" y="145" class="donut-center">'+data.people.length+'</text><text x="150" y="168" class="donut-sub">persones</text></svg></div>';
}

function bars(){
  const total=data.people.length||1;
  const counts=cats.map(c=>({c,n:data.people.filter(p=>ca(p['Tipo'])===c).length})).sort((a,b)=>b.n-a.n);
  let html='<div class="bars">';
  counts.forEach(x=>{
    html+='<div class="bar-row"><div>'+esc(x.c)+'</div><div class="bar-bg"><div class="bar-fill" data-w="'+(x.n/total*100)+'" style="background:'+colors.get(x.c)+'"></div></div><div class="bar-num">'+x.n+' · '+(x.n/total*100).toFixed(0)+'%</div></div>';
  });
  return html+'</div>';
}

function ranking(){
  const m=countConns();
  const rows=data.people.map(p=>({p,n:m.get(String(p.ID))||0})).sort((a,b)=>b.n-a.n);
  let html='<div class="rank">';
  rows.forEach((x,i)=>{html+='<div class="rank-row"><div class="r">'+String(i+1).padStart(2,'0')+'</div><div class="name">'+esc(label(x.p['Nombre']))+'</div><div class="score">'+x.n+' connexions</div></div>'});
  return html+'</div>';
}

function timeline(){
  const yearMap=new Map();
  let unknown=0;
  data.people.forEach(p=>{
    const raw=norm(p['Fecha aprox.']);
    const m=raw.match(/^(\d{4})$/);
    if(m){const y=Number(m[1]);if(!yearMap.has(y))yearMap.set(y,[]);yearMap.get(y).push(label(p['Nombre']))}else unknown++;
  });
  const entries=[...yearMap.entries()].sort((a,b)=>a[0]-b[0]);
  const max=Math.max(1,...entries.map(x=>x[1].length));
  if(!entries.length)return '<div class="no-data">No consta cap any exacte a “Fecha aprox.”.</div>';

  let axis='<div class="evo-axis-wrap"><div class="evo-axis">';
  entries.forEach(([y,names])=>{
    axis+='<div class="evo-point"><div class="evo-year">'+y+'</div><div class="evo-names">';
    names.forEach(n=>{axis+='<span>'+esc(n)+'</span>'});
    axis+='</div></div>';
  });
  axis+='</div></div>';

  let chart='<div class="timeline">';
  entries.forEach(([y,names])=>{
    chart+='<div class="tl-col"><div class="tl-count">'+names.length+'</div><div class="tl-bar" data-h="'+Math.max(16,names.length/max*190)+'"></div><div class="tl-label"><span><span class="tl-year">'+y+'</span>'+(names.length===1?'':'<div class="tl-note">persones</div>')+'</span></div></div>';
  });
  chart+='</div>';
  const note=unknown?'<div class="world-foot">'+unknown+' persona'+(unknown===1?'':'es')+' no té un any exacte i no s’ha col·locat a la línia temporal.</div>':'';
  return axis+chart+note;
}

function heatmap(){
  const cats2=[...cats];
  const idx=new Map(cats2.map((c,i)=>[c,i]));
  const mat=cats2.map(()=>cats2.map(()=>0));
  const unique=uniqueConnections();

  unique.forEach(key=>{
    const [idA,idB]=key.split('|||');

    const a=data.people.find(p=>String(p.ID)===idA);
    const b=data.people.find(p=>String(p.ID)===idB);

    if(!a||!b)return;

    const i=idx.get(ca(a['Tipo']));
    const j=idx.get(ca(b['Tipo']));

    if(i==null||j==null)return;

    mat[i][j]++;
    if(i!==j)mat[j][i]++;
  });

  const max=Math.max(1,...mat.flat());
  let html='<div class="heat" style="grid-template-columns:140px repeat('+cats2.length+',minmax(55px,1fr))"><div></div>';
  cats2.forEach(c=>{html+='<div class="heat-label">'+esc(c)+'</div>'});
  cats2.forEach((c,i)=>{
    html+='<div class="heat-label">'+esc(c)+'</div>';
    cats2.forEach((_,j)=>{
      const n=mat[i][j],a=n/max;
      html+='<div class="heat-cell" style="background:rgba(0,184,111,'+(n?(0.07+0.63*a):0.015)+')">'+(n||'')+'</div>';
    });
  });
  return html+'</div>';
}

function worldOverlap(){
  const peopleById=new Map(data.people.map(p=>[String(p.ID),p]));
  const cross=new Map();
  const worldStats=new Map(cats.map(c=>[c,{people:new Set(),cross:0}]));
  const unique=uniqueConnections();

  unique.forEach(key=>{
    const [idA,idB]=key.split('|||');

    const a=peopleById.get(idA);
    const b=peopleById.get(idB);

    if(!a||!b)return;

    const ta=ca(a['Tipo']);
    const tb=ca(b['Tipo']);

    if(ta===tb)return;

    const pairKey=[ta,tb].sort().join('|||');

    cross.set(pairKey,(cross.get(pairKey)||0)+1);

    worldStats.get(ta).people.add(String(a.ID));
    worldStats.get(tb).people.add(String(b.ID));

    worldStats.get(ta).cross++;
    worldStats.get(tb).cross++;
  });

  const totalCross=[...cross.values()].reduce((a,b)=>a+b,0);
  const top=[...worldStats.entries()].filter(([,v])=>v.cross>0).sort((a,b)=>b[1].cross-a[1].cross).slice(0,3);

  if(!top.length)return '<div class="no-data">No hi ha connexions entre tipologies diferents a CONEXIONES.</div>';

  const maxPeople=Math.max(1,...top.map(([,v])=>v.people.size));
  const sizes=[185,165,145],pos=[['24%','36%'],['54%','46%'],['39%','62%']];

  let circles='';

  top.forEach(([c,v],i)=>{
    const size=sizes[i]||135,left=pos[i]?.[0]||'50%',topPos=pos[i]?.[1]||'50%',scale=.85+.15*(v.people.size/maxPeople),bg=colorFor(c).replace('hsl(','hsla(').replace(')',', .08)');

    circles+='<div class="venn-circle" style="width:'+size+'px;height:'+size+'px;left:calc('+left+' - '+size/2+'px);top:calc('+topPos+' - '+size/2+'px);color:'+colors.get(c)+';background:'+bg+';opacity:.9;transform:scale('+scale+')"><span>'+esc(c)+'<br><small>'+v.cross+' pont'+(v.cross===1?'':'s')+'</small></span></div>';
  });

  let summary='';

  top.forEach(([c,v],i)=>{
    const pct=totalCross?Math.round(v.cross/totalCross*100):0;

    summary+='<div class="world-card"><div class="lab">'+String(i+1).padStart(2,'0')+' · MÓN</div><div class="name">'+esc(c)+'</div><div class="detail">'+v.people.size+' persones implicades en connexions amb altres mons · '+v.cross+' connexions creuades.</div><div class="pill">'+pct+'% de les connexions entre tipologies</div></div>';
  });

  return '<div class="worlds-wrap"><div class="venn">'+circles+'<div class="world-foot" style="position:absolute;left:18px;right:18px;bottom:14px">La mida del cercle representa quantes persones del món participen en connexions amb altres tipologies. El percentatge correspon a la part dels ponts entre tipologies en què participa cada món.</div></div><div class="world-summary">'+summary+'<div class="world-foot">És una visualització de solapament, no un Venn matemàtic: només es mostren els tres mons amb més connexions creuades reals.</div></div></div>';
}

function bridge(){

  const m=countConns();

  const max=
    data.people.reduce(
      (best,p)=>{
        const n=m.get(String(p.ID))||0;
        return n>(best?.n??-1)?{p,n}:best;
      },
      null
    );

  const connected=
    [...m.values()]
      .filter(n=>n>0)
      .length;

  const connectedPct=
    data.people.length
      ? connected/data.people.length*100
      : 0;

  const totalConnections=
    uniqueConnections().size;

  const possibleConnections=
    data.people.length>1
      ? data.people.length*(data.people.length-1)/2
      : 0;

  const density=
    possibleConnections
      ? totalConnections/possibleConnections*100
      : 0;

  /*
    Aquesta mitjana expressa quantes persones addicionals
    apareixen connectades, de mitjana, a cada persona
    que forma part de la xarxa.
  */

  const avgPerConnected=
    connected
      ? totalConnections*2/connected
      : 0;

  const exact=Math.floor(avgPerConnected);
  const partial=(avgPerConnected-exact)>0.01;

  let fanNodes='';

  for(let i=0;i<exact;i++){
    fanNodes+='<div class="fan-node"></div>';
  }

  if(partial){
    fanNodes+='<div class="fan-node" style="opacity:'+Math.max(.25,avgPerConnected-exact).toFixed(2)+'"></div>';
  }

  return '<div class="bridge">'+

    '<div>'+

      '<h2>'+
        'Conèixer-te no és només conèixer-te a tu: és entrar en una xarxa de persones que, d’una manera o altra, acaba fent-se més gran.'+
      '</h2>'+

      '<p>'+
        '“Quan algú et coneix, no només entra en la teva vida: entra en una xarxa de persones, grups i històries que potser mai no hauria arribat a descobrir sense tu.”'+
      '</p>'+

      '<div class="network-explainer">'+

        '<div class="network-visual">'+

          '<div class="network-stage">'+

            '<div class="network-node samu">'+
              'SAMU'+
            '</div>'+

            '<div class="network-link a"></div>'+

            '<div class="network-node person">'+
              'PERSONA<br>QUE ET CONEIX'+
            '</div>'+

            '<div class="network-link b"></div>'+

            '<div class="fan">'+
              fanNodes+
              '<div class="fan-label">'+
                avgPerConnected.toFixed(1)+
                ' persones<br>de mitjana'+
              '</div>'+
            '</div>'+

          '</div>'+

        '</div>'+

        '<div class="network-caption">'+

          '<p>'+
            'Quan algú et coneix, sovint acaba coneixent també altres persones que formen part de la teva xarxa. En les dades que has construït, cada persona que et coneix està vinculada, de mitjana, amb <strong>'+
            avgPerConnected.toFixed(1)+
            '</strong> persones més. És aquesta capacitat de posar en contacte mons diferents la que fa que una sola connexió pugui acabar generant-ne moltes més. El dibuix representa aquesta idea: <strong>tu → una persona que et coneix → altres persones que acaba coneixent gràcies a aquesta connexió.</strong>'+
          '</p>'+

          '<p class="density-note">'+

            'La <strong>densitat real</strong> de la malla és del <strong>'+
            density.toFixed(2)+
            '%</strong>. Aquesta xifra ens diu fins a quin punt totes aquestes persones estan connectades entre elles. De les '+
            possibleConnections+
            ' parelles que podrien existir entre les '+
            data.people.length+
            ' persones de la xarxa, n’hi ha '+
            totalConnections+
            ' que tenen una connexió registrada. Dit d’una altra manera, existeix aproximadament 1 de cada '+
            (density ? Math.round(100/density) : 0)+
            ' connexions possibles. La densitat no mesura quanta gent coneixes, sinó fins a quin punt les persones que has anat connectant també acaben connectant-se entre elles.'+

          '</p>'+

        '</div>'+

      '</div>'+

    '</div>'+

    '<div class="metrics">'+

      '<div class="metric">'+
        '<div class="lab">Persones</div>'+
        '<div class="val">'+data.people.length+'</div>'+
      '</div>'+

      '<div class="metric">'+
        '<div class="lab">Connexions</div>'+
        '<div class="val">'+totalConnections+'</div>'+
      '</div>'+

      '<div class="metric">'+
        '<div class="lab">Persones connectades</div>'+
        '<div class="val">'+
          connected+
          ' · '+
          connectedPct.toFixed(0)+
          '%'+
        '</div>'+
      '</div>'+

      '<div class="metric">'+
        '<div class="lab">Més connexions directes</div>'+
        '<div class="val">'+
          (max?esc(label(max.p['Nombre'])):'No consta')+
        '</div>'+
      '</div>'+

    '</div>'+

  '</div>';

}

function helpText(key){
  const map={
    univers:'Representa la distribució real de les persones per tipologia. Utilitza PERSONAS: la columna “Tipo”. El donut i les barres compten files de persones per categoria i calculen el percentatge sobre el total.',
    nexes:'És un recompte de les connexions úniques que apareixen a CONEXIONES. Si dues persones indiquen mútuament que es coneixen, la relació només es compta una vegada. Utilitza “ID A” i “ID B”.',
    evolucio:'Mostra només els anys exactes de quatre xifres que consten realment a PERSONAS, columna “Fecha aprox.”. L’eix cronològic col·loca aquests anys en ordre i mostra els noms que tenen aquell any; cada barra representa el nombre de persones amb aquell any. Els valors no exactes o buits no es converteixen ni s’infereixen.',
    mons:'Mostra els tres mons amb més connexions úniques entre tipologies. Utilitza PERSONAS (“Tipo”) i CONEXIONES (“ID A”, “ID B”). Si dues persones indiquen mútuament que es coneixen, la relació només es compta una vegada.',
    pont:'Recull estadístiques calculades directament amb les dades del fitxer: persones de PERSONAS, connexions úniques entre persones, persones amb almenys una connexió i persona amb més connexions directes. La visualització inferior mostra la mitjana de connexions per persona connectada i la densitat real de la malla: connexions existents dividides entre totes les connexions possibles.'
  };
  return map[key]||'';
}

function render(){
  const content=document.getElementById('content');

  content.innerHTML=
    makeSection('01','EL NEXE','Quan algú et coneix, la teva xarxa també s’expandeix.',bridge(),'pont',helpText('pont'))+
    makeSection('02','L’EVOLUCIÓ','Com ha crescut la teva xarxa?',timeline(),'evolucio',helpText('evolucio'))+
    makeSection('03','EL TEU UNIVERS','D’on ve la teva gent?','<div class="grid">'+donut()+bars()+'</div>','univers',helpText('univers'))+
    makeSection('04','MONS QUE ES BARREGEN','Quins cercles es creuen?',worldOverlap(),'mons',helpText('mons'))+
    makeSection('05','ELS NEXES','Qui connecta més mons?',ranking(),'nexes',helpText('nexes'));

  requestAnimationFrame(()=>document.querySelectorAll('.donut circle[data-dash]').forEach(e=>e.setAttribute('stroke-dasharray',e.dataset.dash+' '+1885)));
  document.querySelectorAll('.bar-fill').forEach((e,i)=>setTimeout(()=>e.style.width=e.dataset.w+'%',80+i*35));
  document.querySelectorAll('.tl-bar').forEach((e,i)=>setTimeout(()=>e.style.height=e.dataset.h+'px',100+i*45));
  document.querySelectorAll('.info').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.key,b.dataset.help)));
}

function openModal(key,text){
  document.getElementById('modalTitle').textContent=document.getElementById(key)?.querySelector('.title')?.textContent||'Informació';
  document.getElementById('modalText').textContent=text;
  document.getElementById('modal').classList.add('open');
}

document.getElementById('modalClose').onclick=()=>document.getElementById('modal').classList.remove('open');
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')});

(async()=>{try{await load();render()}catch(e){console.error(e);document.getElementById('content').innerHTML='<div class="no-data">'+esc(e.message)+'</div>'}})();
</script></body></html>
