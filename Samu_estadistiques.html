<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Samu — Estadístiques</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#070707;--ink:#f4f2eb;--muted:#8b8983;--green:#00b86f;--line:rgba(255,255,255,.1);--card:#101010}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif}body{min-height:100vh}.wrap{max-width:1280px;margin:0 auto;padding:28px 30px 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:80px}.kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.back{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#c8c5be}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:80px;align-items:end;margin-bottom:90px}.hero h1{font-size:clamp(52px,8vw,108px);line-height:.9;letter-spacing:-.06em;margin:0;font-weight:650}.hero p{font-size:18px;line-height:1.45;color:#b7b3aa;max-width:470px;margin:0 0 8px}.section{padding:42px 0 56px;border-top:1px solid var(--line);position:relative}.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:32px}.num{font-size:10px;letter-spacing:.15em;color:var(--muted);margin-bottom:8px}.title{font-size:34px;line-height:1;letter-spacing:-.04em;margin:0}.subtitle{color:var(--muted);font-size:14px;margin-top:8px}.info{width:25px;height:25px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:transparent;font-weight:650;cursor:pointer;color:#ddd}.grid{display:grid;grid-template-columns:420px 1fr;gap:55px;align-items:center}.donut-wrap{display:flex;justify-content:center;align-items:center;min-height:340px}.donut{width:300px;height:300px}.bars{display:grid;gap:16px}.bar-row{display:grid;grid-template-columns:150px 1fr 60px;gap:12px;align-items:center;font-size:12px}.bar-bg{height:8px;background:#181818;border-radius:999px;overflow:hidden}.bar-fill{height:100%;width:0;border-radius:999px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}.bar-num{text-align:right;color:var(--muted)}.rank{display:grid;gap:7px}.rank-row{display:grid;grid-template-columns:45px 1fr 90px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07)}.rank-row .r{color:var(--muted);font-size:11px}.rank-row .name{font-size:15px}.rank-row .score{text-align:right;font-variant-numeric:tabular-nums}.timeline{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;align-items:end;min-height:260px}.tl-col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:10px}.tl-bar{width:min(52px,70%);height:0;background:var(--green);border-radius:6px 6px 2px 2px;transition:height 1s cubic-bezier(.2,.8,.2,1)}.tl-count{font-size:12px}.tl-label{font-size:11px;color:var(--muted);text-align:center}.heatmap{overflow:auto}.heat{display:grid;gap:3px;min-width:560px}.heat-cell{min-height:45px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:3px;background:#111;border:1px solid rgba(255,255,255,.03)}.heat-label{font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:5px;text-align:center}.bridge{display:grid;grid-template-columns:1.3fr .7fr;gap:70px;align-items:start}.bridge h2{font-size:48px;line-height:1;letter-spacing:-.04em;margin:0}.bridge p{color:#aaa;max-width:640px;line-height:1.55;font-size:16px}.metrics{display:grid;gap:18px}.metric{padding:18px 0;border-top:1px solid var(--line)}.metric .lab{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}.metric .val{font-size:36px;letter-spacing:-.04em;margin-top:5px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:22px;z-index:20}.modal.open{display:flex}.modal-card{max-width:600px;width:100%;background:#0e0e0e;border:1px solid rgba(255,255,255,.12);padding:30px}.modal-card h3{margin:0 0 12px;font-size:22px}.modal-card p{color:#b9b6ae;line-height:1.55;font-size:14px}.modal-close{margin-top:16px;border:1px solid rgba(255,255,255,.12);background:transparent;padding:9px 14px;border-radius:8px;cursor:pointer}.donut-center{font-size:36px;font-weight:650;text-anchor:middle}.donut-sub{font-size:10px;fill:var(--muted);letter-spacing:.12em;text-anchor:middle;text-transform:uppercase}.no-data{color:var(--muted);padding:20px 0}
@media(max-width:900px){.hero,.grid,.bridge{grid-template-columns:1fr;gap:34px}.hero{margin-bottom:65px}.grid{gap:25px}.bridge h2{font-size:38px}.top{margin-bottom:55px}.wrap{padding:22px 18px 60px}}
</style>
</head><body>
<div class="wrap"><div class="top"><div class="kicker">SAMU SOCIAL MAP</div><a class="back" href="Samu_mapa_interactivo.html">← MAPA</a></div><header class="hero"><h1>L’arquitectura<br>de les teves connexions.</h1><p>Una radiografia de les persones, els cercles i els ponts que formen la teva xarxa social.</p></header><main id="content"></main></div>
<div class="modal" id="modal"><div class="modal-card"><h3 id="modalTitle"></h3><p id="modalText"></p><button class="modal-close" id="modalClose">Tancar</button></div></div>
<script>
const data={people:[],connections:[],refs:[]}; const colors=new Map(); const cats=[];
const ca=v=>(v==null||String(v).trim()==='')?'No consta':String(v).trim(); const norm=v=>v==null?'':String(v).trim();
function colorFor(cat){let h=0;for(let i=0;i<cat.length;i++)h=(h*31+cat.charCodeAt(i))%360;return `hsl(${h} 72% 60%)`}
function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#39;'}[m]))}
function label(name){const p=norm(name).split(/\s+/).filter(Boolean);return p.length>1?`${p[0]} ${p[1][0].toUpperCase()}.`:p[0]||'No consta'}
function rows(s){return XLSX.utils.sheet_to_json(s,{defval:''})}
async function load(){const response=await fetch('data.xlsx',{cache:'no-store'});if(!response.ok)throw new Error('No s’ha pogut carregar data.xlsx.');const buffer=await response.arrayBuffer();const wb=XLSX.read(buffer,{type:'array'});for(const s of ['PERSONAS','CONEXIONES','REFERENCIAS'])if(!wb.SheetNames.includes(s))throw new Error(`Falta la fulla ${s}.`);data.people=rows(wb.Sheets.PERSONAS);data.connections=rows(wb.Sheets.CONEXIONES);data.refs=rows(wb.Sheets.REFERENCIAS);for(const c of [...new Set(data.people.map(p=>ca(p['Tipo'])))]){cats.push(c);colors.set(c,colorFor(c))}}
function countConns(){const m=new Map(data.people.map(p=>[String(p.ID),0]));data.connections.forEach(c=>{const a=String(c['ID A']||''),b=String(c['ID B']||'');if(m.has(a))m.set(a,m.get(a)+1);if(m.has(b))m.set(b,m.get(b)+1)});return m}
function makeSection(num,title,sub,body,key,help){return `<section class="section" id="${key}"><div class="section-head"><div><div class="num">${num}</div><h2 class="title">${title}</h2><div class="subtitle">${sub}</div></div><button class="info" data-help="${esc(help)}" data-key="${key}">i</button></div>${body}</section>`}
function donut(){const counts=cats.map(c=>data.people.filter(p=>ca(p['Tipo'])===c).length);const total=data.people.length||1;let angle=-Math.PI/2;const r=120,cx=150,cy=150,circ=2*Math.PI*r;let offset=0;const arcs=cats.map((c,i)=>{const frac=counts[i]/total;const dash=frac*circ;const x=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors.get(c)}" stroke-width="34" stroke-dasharray="0 ${circ}" data-dash="${dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 150 150)" style="transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1)"/>`;offset+=dash;return x}).join('');return `<div class="donut-wrap"><svg class="donut" viewBox="0 0 300 300"><circle cx="150" cy="150" r="120" fill="none" stroke="#171717" stroke-width="34"/>${arcs}<text x="150" y="145" class="donut-center">${data.people.length}</text><text x="150" y="168" class="donut-sub">persones</text></svg></div>`}
function bars(){const total=data.people.length||1;const counts=cats.map(c=>({c,n:data.people.filter(p=>ca(p['Tipo'])===c).length})).sort((a,b)=>b.n-a.n);return `<div class="bars">${counts.map(x=>`<div class="bar-row"><div>${esc(x.c)}</div><div class="bar-bg"><div class="bar-fill" data-w="${x.n/total*100}" style="background:${colors.get(x.c)}"></div></div><div class="bar-num">${x.n} · ${(x.n/total*100).toFixed(0)}%</div></div>`).join('')}</div>`}
function ranking(){const m=countConns();const rows=data.people.map(p=>({p,n:m.get(String(p.ID))||0})).sort((a,b)=>b.n-a.n);return `<div class="rank">${rows.map((x,i)=>`<div class="rank-row"><div class="r">${String(i+1).padStart(2,'0')}</div><div class="name">${esc(label(x.p['Nombre']))}</div><div class="score">${x.n} connexions</div></div>`).join('')}</div>`}
function timeline(){const groups=new Map();data.people.forEach(p=>{const k=ca(p['Fecha aprox.']);groups.set(k,(groups.get(k)||0)+1)});const entries=[...groups.entries()].sort((a,b)=>{const na=Number(a[0]),nb=Number(b[0]);if(Number.isFinite(na)&&Number.isFinite(nb))return na-nb;return a[0].localeCompare(b[0])});const max=Math.max(1,...entries.map(x=>x[1]));return `<div class="timeline">${entries.map(([k,n])=>`<div class="tl-col"><div class="tl-count">${n}</div><div class="tl-bar" data-h="${Math.max(12,n/max*180)}"></div><div class="tl-label">${esc(k)}</div></div>`).join('')}</div>`}
function heatmap(){const cats2=[...cats];const idx=new Map(cats2.map((c,i)=>[c,i]));const mat=cats2.map(()=>cats2.map(()=>0));data.connections.forEach(c=>{const a=data.people.find(p=>String(p.ID)===String(c['ID A']||''));const b=data.people.find(p=>String(p.ID)===String(c['ID B']||''));if(!a||!b)return;const i=idx.get(ca(a['Tipo'])),j=idx.get(ca(b['Tipo']));if(i==null||j==null)return;mat[i][j]++;if(i!==j)mat[j][i]++});const max=Math.max(1,...mat.flat());let html=`<div class="heat" style="grid-template-columns:140px repeat(${cats2.length},minmax(55px,1fr))"><div></div>${cats2.map(c=>`<div class="heat-label">${esc(c)}</div>`).join('')}`;cats2.forEach((c,i)=>{html+=`<div class="heat-label">${esc(c)}</div>`;cats2.forEach((_,j)=>{const n=mat[i][j];const a=n/max;html+=`<div class="heat-cell" style="background:rgba(0,184,111,${n?(.07+.63*a):.015})">${n||''}</div>`})});return html+'</div>'}
function bridge(){const m=countConns();const max=data.people.reduce((best,p)=>((m.get(String(p.ID))||0)>(best?.n||-1)?{p,n:m.get(String(p.ID))||0}:best),null);const avg=data.people.length?data.connections.length*2/data.people.length:0;return `<div class="bridge"><div><h2>Cada persona que has conegut pot obrir-te un món nou.</h2><p>“Cada persona que has conegut no és només una amistat: és una porta a altres persones, altres grups i altres històries.”</p></div><div class="metrics"><div class="metric"><div class="lab">Persones</div><div class="val">${data.people.length}</div></div><div class="metric"><div class="lab">Connexions</div><div class="val">${data.connections.length}</div></div><div class="metric"><div class="lab">Mitjana de connexions per persona</div><div class="val">${avg.toFixed(1)}</div></div><div class="metric"><div class="lab">Més connexions directes</div><div class="val">${max?esc(label(max.p['Nombre'])):'No consta'}</div></div></div></div>`}
function helpText(key){const map={univers:'Representa la distribució real de les persones per tipologia. Utilitza PERSONAS: la columna “Tipo”. El donut i les barres compten files de persones per categoria i calculen el percentatge sobre el total.',nexes:'És un recompte directe de les connexions que apareixen a CONEXIONES. Utilitza “ID A” i “ID B” i suma una connexió a cada persona quan hi participa una fila. No és una mètrica científica.',evolucio:'Agrupa les persones segons el valor que consta realment a PERSONAS, columna “Fecha aprox.”. No converteix ni infereix dates que no apareguin al fitxer.',mons:'Mostra quantes connexions de CONEXIONES uneixen cada parella de tipologies de PERSONAS. Només hi entren categories presents al full PERSONAS; les connexions sense persones resolubles no s’inclouen al recompte.',pont:'Recull només estadístiques calculades directament amb les dades del fitxer: persones de PERSONAS, files de CONEXIONES, mitjana de connexions per persona i persona amb més incidència a les files de CONEXIONES.'};return map[key]||''}
function render(){const content=document.getElementById('content');content.innerHTML=makeSection('01','EL TEU UNIVERS','D’on ve la teva gent?',`<div class="grid">${donut()}${bars()}</div>`,'univers',helpText('univers'))+makeSection('02','ELS NEXES','Qui connecta més mons?',ranking(),'nexes',helpText('nexes'))+makeSection('03','L’EVOLUCIÓ','Com ha crescut la teva xarxa?',timeline(),'evolucio',helpText('evolucio'))+makeSection('04','MONS QUE ES BARREGEN','Quins cercles es creuen?',heatmap(),'mons',helpText('mons'))+makeSection('05','EL PONT','Cada persona que has conegut pot obrir-te un món nou.',bridge(),'pont',helpText('pont'));requestAnimationFrame(()=>document.querySelectorAll('.donut circle[data-dash]').forEach(e=>e.setAttribute('stroke-dasharray',`${e.dataset.dash} 1885`)));document.querySelectorAll('.bar-fill').forEach((e,i)=>setTimeout(()=>e.style.width=e.dataset.w+'%',80+i*35));document.querySelectorAll('.tl-bar').forEach((e,i)=>setTimeout(()=>e.style.height=e.dataset.h+'px',100+i*45));document.querySelectorAll('.info').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.key,b.dataset.help)))}
function openModal(key,text){document.getElementById('modalTitle').textContent=document.getElementById(key)?.querySelector('.title')?.textContent||'Informació';document.getElementById('modalText').textContent=text;document.getElementById('modal').classList.add('open')}
document.getElementById('modalClose').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')});
(async()=>{try{await load();render()}catch(e){console.error(e);document.getElementById('content').innerHTML=`<div class="no-data">${esc(e.message)}</div>`}})();
</script></body></html>
